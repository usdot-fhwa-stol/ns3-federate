name: Docker Hub build
on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - master
      - "release/*"
    tags:
      - "carma-system-*"
jobs:
  dockerhub-dsrc-default:
    uses: usdot-fhwa-stol/actions/.github/workflows/dockerhub.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      runner: ubuntu-latest-8-cores
      file: Dockerfile.dsrc
  dockerhub-dsrc:
    uses: usdot-fhwa-stol/actions/.github/workflows/dockerhub.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      runner: ubuntu-latest-8-cores
      file: Dockerfile.dsrc
      tag_name_suffix: dsrc
  dockerhub-5g-nr:
    uses: usdot-fhwa-stol/actions/.github/workflows/dockerhub.yml@main
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      runner: ubuntu-latest-8-cores
      file: Dockerfile.nr
      tag_name_suffix: 5g-nr

  determine_docker_org_and_tag:
    needs:
      - dockerhub-dsrc-default
      - dockerhub-dsrc
      - dockerhub-5g-nr
    if: ${{ github.ref_type == 'branch' }}
    runs-on: ubuntu-latest

    outputs:
      docker_organization: ${{ steps.docker-org-and-tag.outputs.docker_organization }}
      docker_image_tag: ${{ steps.docker-org-and-tag.outputs.docker_image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: docker-org-and-tag
        uses: usdot-fhwa-stol/actions/docker-org-and-tag@main

  docker-scout-record:
    needs: determine_docker_org_and_tag
    runs-on: ubuntu-latest

    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker Scout Record DSRC
        uses: docker/scout-action@v1
        with:
          command: environment
          environment: ${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}-dsrc
          image: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/ns3-federate:${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}-dsrc
          organization: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}

      - name: Docker Scout Record 5G NR
        uses: docker/scout-action@v1
        with:
          command: environment
          environment: ${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}-5g-nr
          image: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/ns3-federate:${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}-5g-nr
          organization: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}