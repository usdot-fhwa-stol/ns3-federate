name: Docker build
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  docker-dsrc:
    uses: usdot-fhwa-stol/actions/.github/workflows/docker.yml@main
    with:
      runner: ubuntu-latest
      file: Dockerfile.dsrc

  docker-5g-nr:
    uses: usdot-fhwa-stol/actions/.github/workflows/docker.yml@main
    with:
      runner: ubuntu-latest
      file: Dockerfile.nr